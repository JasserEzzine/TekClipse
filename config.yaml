simulation:
  seed: 42
  hours: 24
  hz: 1
  nominal_train_fraction: 0.7
  data_dir: "tekclipse/data/generated"

scenarios:
  enabled:
    - E1
    - E2
    - E3
    - E4
    - E5
    - E6
  injection_window_seconds: 60

telemetry:
  temp_min: 35
  temp_max: 45
  cpu_min: 20
  cpu_max: 60
  ram_min: 40
  ram_max: 70
  battery_min: 40
  battery_max: 100
  voltage_min: 27.5
  voltage_max: 28.5
  power_min: 80
  power_max: 150
  signal_min: -95
  signal_max: -75

commands:
  interval_seconds: 300
  sources: ["GS_PRIMARY", "GS_BACKUP"]
  types: ["CAMERA_ON", "CAMERA_OFF", "REBOOT", "DOWNLOAD", "UPLOAD", "CONFIG_UPDATE", "FIRMWARE_UPDATE"]
  flood_threshold_per_min: 10

network:
  nominal_rate: 1000.0
  spike_multiplier: 10.0
  packets_base: 50
  bytes_base: 1200

system:
  auth_failure_rate: 0.01

rules:
  r1_unauthorized_source: "UNKNOWN_1"
  r2_critical_commands_per_minute: 10
  r3_temp_limit_c: 85
  r3_voltage_min: 26
  r3_voltage_max: 30

model:
  isolation_forest:
    n_estimators: 100
    contamination: 0.05
    random_state: 42
  score_threshold_quantile: 0.95

ui:
  dark_background: "#0A1628"
  panel_background: "#0E223E"
  cyan: "#22D3EE"
  success: "#34D399"
  warning: "#FBBF24"
  critical: "#F87171"
