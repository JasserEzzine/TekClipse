name: Tests and security checks

on:
  push:
    branches: [tekclipse-cloud]
  pull_request:
    branches: [tekclipse-cloud]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pinned runtime and audit tools
        run: python -m pip install -r requirements.txt bandit==1.9.4 pip-audit==2.10.1 detect-secrets==1.5.0
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Regression tests
        run: python -m pytest -q
      - name: Python source analysis
        run: python -m bandit -r tekclipse scripts streamlit_app.py
      - name: Dependency advisories
        run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - name: Scan tracked content for secrets
        run: |
          detect-secrets scan > /tmp/tekclipse-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path
          findings = json.loads(Path('/tmp/tekclipse-secrets.json').read_text())['results']
          if findings:
              raise SystemExit('Potential secrets found; review the affected files without printing secret values.')
          print('No potential secrets detected in tracked files.')
          PY
